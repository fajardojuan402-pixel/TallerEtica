name: Fairness Audit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Verifica que la HERRAMIENTA de auditoría funciona (siempre debe ser verde)
  unit-tests:
    name: Tests del script de auditoría
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  # Verifica que el MODELO cumple la regla 4/5 (rojo si hay impacto dispar)
  fairness-gate:
    name: Compuerta de equidad (regla 4/5)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Auditar data/model_predictions.csv
        run: python scripts/calculate_audit.py --data data/model_predictions.csv
